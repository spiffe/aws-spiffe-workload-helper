apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: test
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: test
    spec:
      initContainers:
      - name: spiffe-helper-init
        image: ghcr.io/spiffe/spiffe-helper:0.11.0
        args: ["-config", "/etc/spiffe-helper/helper.conf", "-daemon-mode=false"]
        volumeMounts: &spiffeHelperMounts
        - mountPath: /spiffe-workload-api
          name: spiffe-workload-api
          readOnly: true
        - mountPath: /etc/spiffe-helper
          name: spiffe-helper-config
          readOnly: true
        - mountPath: /spiffe-certs
          name: spiffe-certs
      containers:
      - command:
        - /bin/bash
        args:
        - -c
        - |
          mkdir -p ~/.aws
          cat > ~/.aws/config <<EOF
          [default]
          credential_process = env SSL_CERT_FILE=/spiffe-certs/ca.crt /tmp/aws-spiffe-workload-helper jwt-credential-process --role-arn "arn:aws:iam::000000000000:role/spire" --audience versitygw --endpoint 'https://versitygw-iam.versitygw:7070' --workload-api-addr unix:/spiffe-workload-api/spire-agent.sock --role-session-name "test"
          EOF
          yum install -y tar
          while true; do sleep 1000; done
        name: main
        image: amazon/aws-cli:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: AWS_ENDPOINT_URL
          value: "https://versitygw.versitygw:7070"
        - name: AWS_CA_BUNDLE
          value: /spiffe-certs/ca.crt
        - name: AWS_REGION
          value: us-east-1
        - name: AWS_CONFIG_FILE
          value: ~/.aws/config
        - name: AWS_PROFILE
          value: default
        - name: AWS_EC2_METADATA_DISABLED
          value: "true"
        volumeMounts:
        - mountPath: /spiffe-workload-api
          name: spiffe-workload-api
          readOnly: true
        - mountPath: /spiffe-certs
          name: spiffe-certs
          readOnly: true
      - name: spiffe-helper
        image: ghcr.io/spiffe/spiffe-helper:0.11.0
        args: ["-config", "/etc/spiffe-helper/helper.conf"]
        volumeMounts: *spiffeHelperMounts
      volumes:
      - csi:
          driver: csi.spiffe.io
          readOnly: true
        name: spiffe-workload-api
      - configMap:
          name: spiffe-helper
        name: spiffe-helper-config
      - emptyDir: {}
        name: spiffe-certs
